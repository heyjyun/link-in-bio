
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Link in Bio</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>


<style>

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding-top: 40px;
      padding-bottom: 40px;
      background: conic-gradient(from 220deg at 50% 50%,
        #D7D2CA,
        #DDD1BF,
        #C9AEA3,
        #C5A5A1,
        #B5A7BA,
        #91A6B2,
        #91AAA8,
        #A7B5A1
      );
      color: white
      ;
      font-family: "Raleway", Arial, sans-serif;
    }

    .main-container {
      max-width: 500px;
      margin: auto;
      text-align: center;
    }

    .avatar-image {
      width: 266px;
      height: 266px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 0px;
    }

    .name-row {
      font-family: "Cormorant Garamond", sans-serif;
      font-size: 36px;
      font-weight: 700;
      margin-top: 20px;
      margin-right: 0;
      margin-bottom: 30px;
      margin-left: 0;
      text-align: center;
    }

    .social-icons-row {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 1px;
      margin-bottom: 30px;
    }

    .social-icons-row a {
      color: white;
      text-decoration: none;
      font-size: 30px;
      transition: transform 0.2s;
    }

   .social-icons-row a:hover {
      transform: scale(1.15);
    }

    .links-row {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 51px;
      text-align: center;
      box-shadow: 5px 5px 8px 0px rgba(223, 220, 205, 0.5);
      
    }

    .item img {
      width: 39px;
      height: 39px;
      object-fit: cover;
      border-radius: 51px;
    }

    .item a {
      font-family: "Jost", sans-serif;
      font-size: 16px;
      font-weight: 411;
      color: white;
      text-decoration: none;
      flex: 1;
      text-align: center;
      transform: translateX(-17px);
    }
  </style>
</head>

<body>

  <div class="main-container">
