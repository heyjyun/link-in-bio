
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Link in Bio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(
        180deg,
        #D7D2CA,
        #DDD1BF,
        #C9AEA3,
        #C5A5A1,
        #B5A7BA,
        #91A6B2,
        #91AAA8,
        #A7B5A1
      );
      color: white;
      font-family: "Raleway", Arial, sans-serif;
    }

    .main-container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .image-row img {
      width: 266px;
      height: 266px;
      border-radius: 50%;
      object-fit: cover;
    }

    .name-row {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .social-icons-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }

    .social-icons-row a {
      color: white;
      text-decoration: none;
    }

    .links-row {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-align: left;
    }

    .item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .item a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* 调试布局时，可以打开这条规则：
    * {
      border: 1px red dashed;
    }
    */
  </style>
</head>

<body>

  <div class="main-container">

    <!-- 1. Avatar -->
    <div class="image-row">
      <img src="/thumbnails/headshot.jpeg"
           alt="Jyun Zhou headshot">
    </div>

    <!-- 2. Name -->
    <div class="name-row">
      Jyun Zhou
    </div>

    <!-- 3. Social media links -->
    <div class="social-icons-row">

      <a href="https://github.com/heyjyun"
         target="_blank" rel="noopener noreferrer">
        GitHub
      </a>

      <a href="https://www.linkedin.com/in/jyunzhou"
         target="_blank" rel="noopener noreferrer">
        LinkedIn
      </a>

      <a href="https://www.instagram.com/jyunkojika/"
         target="_blank" rel="noopener noreferrer">
        Instagram
      </a>

      <a href="https://x.com/jyun_zhou37286"
         target="_blank" rel="noopener noreferrer">
        X
      </a>

    </div>

    <!-- 4. Featured links -->
    <div class="links-row">

      <div class="item">
        <img src="/thumbnails/deer.jpeg" alt="Kojika Jyun Ko - Deer">

        <a href="https://paulgraham.com/startupideas.html"
           target="_blank" rel="noopener noreferrer">
          How to Get Startup Ideas
        </a>
      </div>

      <div class="item">
        <img src="/thumbnails/typography.jpg" alt="Typography">

        <a href="https://practicaltypography.com/typography-in-ten-minutes.html"
           target="_blank" rel="noopener noreferrer">
          Typography in ten minutes
        </a>
      </div>

    </div> <!-- links-row -->

  </div> <!-- main-container -->

</body>
</html>
